<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Demo Store</title>
<!-- Google Tag Manager'ı buraya kendi Container ID'inle ekleyeceksin -->
<!-- <script>(function(w,d,s,l,i){...})(window,document,'script','dataLayer','GTM-XXXXXXX');</script> -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .product-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    max-width: 360px;
    width: 100%;
    overflow: hidden;
  }
  .product-image {
    height: 220px;
    background: linear-gradient(135deg, #60A5FA, #34D399);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }
  .product-info { padding: 24px; }
  .product-info h2 { font-size: 20px; margin-bottom: 8px; }
  .product-info .price { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; }
  .product-info p { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-secondary { background: #eee; color: #1a1a1a; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  #status {
    margin-top: 14px;
    font-size: 13px;
    color: #34D399;
    min-height: 18px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="product-card">
  <div class="product-image">🎒</div>
  <div class="product-info">
    <h2>Recycled Canvas Backpack</h2>
    <div class="price">$68.00</div>
    <p>Su geçirmez, geri dönüştürülmüş kumaştan üretilmiş, günlük kullanım için tasarlanmış sırt çantası.</p>

    <button class="btn btn-secondary" id="add-to-cart-btn" data-product="Recycled Canvas Backpack" data-price="68.00">
      Sepete Ekle
    </button>
    <button class="btn btn-primary" id="buy-now-btn" data-product="Recycled Canvas Backpack" data-price="68.00">
      Şimdi Satın Al
    </button>

    <div id="status"></div>
  </div>
</div>

<script>
  // dataLayer henüz yoksa oluştur (GTM eklenmeden de sayfa çalışsın diye)
  window.dataLayer = window.dataLayer || [];

  function pushEvent(eventName, btn) {
    var product = btn.getAttribute('data-product');
    var price = btn.getAttribute('data-price');

    window.dataLayer.push({
      event: eventName,
      ecommerce: {
        items: [{
          item_name: product,
          price: parseFloat(price)
        }]
      }
    });

    // Sayfada görsel geri bildirim (GTM'siz de test edebilmen için)
    var status = document.getElementById('status');
    status.textContent = '✓ dataLayer event gönderildi: "' + eventName + '"';
    setTimeout(function() { status.textContent = ''; }, 2500);

    console.log('dataLayer push:', window.dataLayer[window.dataLayer.length - 1]);
  }

  document.getElementById('add-to-cart-btn').addEventListener('click', function() {
    pushEvent('add_to_cart', this);
  });

  document.getElementById('buy-now-btn').addEventListener('click', function() {
    pushEvent('purchase_click', this);
  });
</script>

</body>
</html>
